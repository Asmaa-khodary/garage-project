<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarWash Pro - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="fas fa-car-side"></i></div>
            <span>CarWash <span class="text-red">Pro</span></span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-item active" onclick="changePage('dashboard')">
                <i class="fas fa-home"></i> Dashboard
            </div>
            <div class="nav-item" onclick="changePage('requests')">
                <i class="fas fa-clipboard-list"></i> My Orders
            </div>
            <div class="nav-item" onclick="changePage('settings')">
                <i class="fas fa-cog"></i> Settings
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-title">Control <span>Panel</span></div>
            <div class="topbar-icons">
                <i class="fas fa-bell"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </header>

        <div class="container">
            <div class="welcome-banner">
                <h1>🏎️ Welcome!</h1>
                <p>Manage your car services with speed and style.</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon pending"><i class="fas fa-clock"></i></div>
                    <div>
                        <div class="stat-num" id="count-pending">1</div>
                        <div class="stat-label">Pending</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon complete"><i class="fas fa-check-circle"></i></div>
                    <div>
                        <div class="stat-num">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                </div>
            </div>

            <div class="section-header">
                <h2>Recent Orders</h2>
                <button class="btn-primary" onclick="addNewRequest()">
                    <i class="fas fa-plus"></i> New Request
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Service</th>
                            <th>Car</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody">
                        <tr>
                            <td>April 25, 2024</td>
                            <td>Full Wash</td>
                            <td>Mercedes C200</td>
                            <td><span class="status-badge pending">Pending</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
